<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARE HMIS: internal referral token journey</title>
<style>
:root{
  --bg:#f7f8fa;--surface:#ffffff;--ink:#172030;--muted:#5b6577;--line:#d9dde4;
  --accent:#0e5a6b;--accent-wash:#e3f1f4;--coral:#d85a30;--ok:#1f7a4d;--ok-wash:#e4f3ea;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f141b;--surface:#161d27;--ink:#e6eaf0;--muted:#9aa5b5;--line:#2a3340;
    --accent:#6fc3d6;--accent-wash:#12303a;--coral:#f0997b;--ok:#5fd08f;--ok-wash:#12301f;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:24px 16px}
.fig{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px}
.fig svg{display:block;width:100%;height:auto}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0 4px;font-size:14px}
.bar button{font:inherit;color:var(--accent);background:var(--accent-wash);border:1px solid var(--accent);border-radius:8px;padding:6px 14px;cursor:pointer}
.bar button:hover{filter:brightness(0.97)}
#readout{font-size:14px;color:var(--muted);margin:6px 0 0}
svg text{font-family:var(--sans)}
.t{font-size:14px;font-weight:600;fill:var(--ink)}
.s{font-size:12px;fill:var(--muted)}
.a{fill:var(--accent)}
.c{fill:var(--coral)}
.nrect{fill:var(--surface);stroke:var(--line);stroke-width:1}
.nrect.new{fill:var(--accent-wash);stroke:var(--accent)}
.nrect.active{stroke:var(--coral);stroke-width:2}
.ar{fill:none;stroke:#8a93a3;stroke-width:1.2}
.ar.hot{stroke:var(--coral);stroke-width:2}
.old{fill:none;stroke:#8a93a3;stroke-width:1;stroke-dasharray:4 4}
.track{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.tok{transition:transform .9s cubic-bezier(.65,0,.35,1)}
.tok.jump{transition:none}
.card{transition:transform .65s cubic-bezier(.65,0,.35,1),opacity .3s ease}
.card rect{fill:var(--surface);stroke:var(--line);stroke-width:1}
.card.ongoing rect{stroke:var(--ok);stroke-width:1.5}
.card.focus rect{fill:var(--accent-wash);stroke:var(--coral);stroke-width:2}
.pill-dest{fill:var(--accent-wash)}
.pill-on{fill:var(--ok-wash)}
.ok{fill:var(--ok)}
@media (prefers-reduced-motion:reduce){.tok,.card{transition:none}}
</style>
</head>
<body>
<figure class="fig" style="margin:0 auto">
  <svg id="flowsvg" viewBox="0 0 680 212" role="img" aria-labelledby="flow-t flow-d">
    <title id="flow-t">Single token across an internal referral</title>
    <desc id="flow-d">Token GM-014 is issued at registration, waits in the General medicine queue, is consulted, referred, and joins the end of the Cardiology queue without a new token. The dashed loop shows today's flow, where the patient goes back to registration for a new token.</desc>
  </svg>
  <div class="bar">
    <button type="button" id="replay">Replay referral</button>
  </div>
  <svg id="queuesvg" viewBox="0 0 680 172" role="img" aria-labelledby="q-t q-d">
    <title id="q-t">Cardiology queue</title>
    <desc id="q-d">Queue of tokens in Cardiology. The referred token GM-014 is added to the end of the existing queue and keeps its original number. No clinical priority is shown.</desc>
  </svg>
  <p id="readout" aria-live="polite"></p>
</figure>

<script>
(function(){
var NS='http://www.w3.org/2000/svg';
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs){e.setAttribute(k,attrs[k]);}if(parent){parent.appendChild(e);}return e;}
function tx(parent,x,y,s,cls,anchor){var t=el('text',{x:x,y:y,'text-anchor':anchor||'middle','dominant-baseline':'central','class':cls},parent);t.textContent=s;return t;}
function marker(defs,id,color){
  var m=el('marker',{id:id,viewBox:'0 0 10 10',refX:'8',refY:'5',markerWidth:'6',markerHeight:'6',orient:'auto-start-reverse'},defs);
  el('path',{d:'M2 1L8 5L2 9',fill:'none',stroke:color,'stroke-width':'1.5','stroke-linecap':'round','stroke-linejoin':'round'},m);
}

var flow=document.getElementById('flowsvg');
var fdefs=el('defs',{},flow);
marker(fdefs,'arrG','#8a93a3');
marker(fdefs,'arrC','#d85a30');
var nodes=[
  {t:'Register',s:'GM-014 issued'},
  {t:'GM queue',s:'Gen. medicine'},
  {t:'Consult',s:'Doctor decides'},
  {t:'Refer',s:'Dept + doctor',n:true},
  {t:'CA queue',s:'Cardiology'}
];
function NX(i){return 22+i*132;}
function CX(i){return NX(i)+54;}
el('line',{x1:CX(0),x2:CX(4),y1:34,y2:34,'class':'track'},flow);
el('path',{d:'M'+CX(3)+' 122 V170 H'+CX(0)+' V126','class':'old','marker-end':'url(#arrG)'},flow);
tx(flow,(CX(0)+CX(3))/2,190,'Today: back to registration for a new token','s');
for(var i=0;i<4;i++){
  el('line',{x1:NX(i)+110,x2:NX(i+1)-3,y1:90,y2:90,'class':'ar'+(i===3?' hot':''),'marker-end':'url(#'+(i===3?'arrC':'arrG')+')'},flow);
}
var rects=[];
nodes.forEach(function(d,i){
  var g=el('g',{transform:'translate('+NX(i)+',62)'},flow);
  rects.push(el('rect',{width:108,height:56,rx:8,'class':'nrect'+(d.n?' new':'')},g));
  tx(g,54,20,d.t,'t'+(d.n?' a':''));
  tx(g,54,39,d.s,'s'+(d.n?' a':''));
});
tx(flow,CX(4)+8,138,'Keeps GM-014 number','s c');
var tok=el('g',{'class':'tok'},flow);
tok.style.transform='translate('+CX(0)+'px,34px)';
el('circle',{r:23,fill:'#F0997B',stroke:'#993C1D','stroke-width':1},tok);
var tt=tx(tok,0,0,'GM-014','s');
tt.setAttribute('style','fill:#4A1B0C;font-weight:600');

function highlight(i){rects.forEach(function(r,j){r.classList.toggle('active',j===i);});}
function place(i){tok.style.transform='translate('+CX(i)+'px,34px)';}
var cur=0;
function step(i){
  highlight(i);
  if(i===0){
    tok.classList.add('jump');place(0);void tok.getBoundingClientRect();tok.classList.remove('jump');
  }else{place(i);}
  cur=i;
}
if(reduce){
  step(3);
}else{
  step(0);
  setInterval(function(){step((cur+1)%5);},1700);
}

var q=document.getElementById('queuesvg');
function qx(k){return 27+k*106;}
var CY=76;
el('rect',{x:27,y:6,width:206,height:28,rx:14,'class':'pill-dest'},q);
tx(q,130,20,'Destination: Cardiology (CA)','s a').setAttribute('style','font-weight:600');
el('rect',{x:27,y:46,width:96,height:22,rx:11,'class':'pill-on'},q);
el('circle',{cx:41,cy:57,r:4,'class':'ok'},q);
tx(q,52,57,'Ongoing','s ok','start').setAttribute('style','font-weight:600');
tx(q,133,57,'Waiting, called in order','s','start');
var layer=el('g',{},q);

var queue=[
  {id:'CA-009',c:true},
  {id:'CA-011'},
  {id:'OR-006',src:'Orthopedics'},
  {id:'CA-015'},
  {id:'CA-017'}
];
function makeCard(d,focus){
  var g=el('g',{'class':'card'+(d.c?' ongoing':'')+(focus?' focus':'')},layer);
  el('rect',{width:96,height:64,rx:8},g);
  tx(g,48,32,d.id,'t'+(focus?' a':''));
  if(d.src){tx(g,48,84,'From '+d.src,'s'+(focus?' c':''));}
  d.el=g;
  return g;
}
queue.forEach(function(d){makeCard(d,false);});
var ref=null;
function layout(){
  var items=queue.slice();
  if(ref){items.push(ref);}
  items.forEach(function(d,i){
    d.el.style.transform='translate('+qx(i)+'px,'+CY+'px)';
    d.el.style.opacity=1;
  });
  var ro=document.getElementById('readout');
  if(ref){
    var pos=items.length-1;
    ro.textContent='GM-014 joins the end of the Cardiology queue at waiting position '+pos+', with '+(pos-1)+' patients ahead. It keeps its original number, no clinical priority is captured, and the ongoing consultation is never displaced.';
  }else{
    ro.textContent='';
  }
}
function addRef(){
  ref={id:'GM-014',src:'General medicine'};
  var g=makeCard(ref,true);
  var slot=queue.length+1;
  g.style.transform='translate('+qx(slot)+'px,'+(CY-34)+'px)';
  g.style.opacity=0;
  void g.getBoundingClientRect();
  layout();
}
var timer=null;
function replay(){
  if(timer){clearTimeout(timer);timer=null;}
  if(ref){
    var old=ref.el;
    old.style.opacity=0;
    ref=null;
    layout();
    setTimeout(function(){if(old.parentNode){old.parentNode.removeChild(old);}},300);
  }
  timer=setTimeout(function(){timer=null;if(!ref){addRef();}},reduce?0:420);
}
document.getElementById('replay').addEventListener('click',replay);
addRef();
layout();
})();
</script>
</body>
</html>
